# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - helpdesk-web-app-test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://830a800f157944e49ffe19b66e2b1d03.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_cbcfa55111c54be6841e31b4ceecf00d }}
        password: ${{ secrets.AzureAppService_ContainerPassword_74197ecd31d44c4b9efa94ccabaaad2e }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: 830a800f157944e49ffe19b66e2b1d03.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_cbcfa55111c54be6841e31b4ceecf00d }}/sample-app-aoai-chatgpt:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'helpdesk-web-app-test'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_61a1a3b8e8a94e959547031176a5594f }}
        images: '830a800f157944e49ffe19b66e2b1d03.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_cbcfa55111c54be6841e31b4ceecf00d }}/sample-app-aoai-chatgpt:${{ github.sha }}'